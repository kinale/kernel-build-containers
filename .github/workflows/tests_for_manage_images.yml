name: tests for manage_images

permissions:
  contents: read

on:
  push:
    branches: [ master ]

jobs:
  tests_for_manage_images:

    if: github.repository == 'a13xp0p0v/kernel-build-containers'

    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        python-version: ['3.14']

    steps:

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get the source code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes expect podman
        python3 -m pip install coverage

    - name: Use a tiny Dockerfile for faster image management tests
      run: |
        cp tests/CI_Dockerfile Dockerfile

    - name: Test the image management
      run: |
        bash tests/tests_for_manage_images.sh

    - name: Prepare the final coverage report
      run: |
        coverage xml -i -o coverage.xml

    - name: Handle coverage
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: ./coverage.xml
        flags: tests_for_manage_images
        name: tests_for_manage_images_upload
        fail_ci_if_error: true
        verbose: true
